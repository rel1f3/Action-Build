      run: 'echo "CCACHE_DIR=$HOME/.ccache_${{ ''oneplus_ace5_pro_b'' }}" >> $GITHUB_ENV

        mkdir -p "$HOME/.ccache_${{ ''oneplus_ace5_pro_b'' }}"

        echo "set: $HOME/.ccache_${{ ''oneplus_ace5_pro_b'' }}"

        '
    - name: Fork Check
      run: "repo=\"${{ github.repository }}\"; json=$(curl -s \"https://api.github.com/repos/$repo\")\nparent=$(echo \"$json\" | grep\
        \ -o '\"full_name\": *\"[^\"]*\"' | head -n 2 | tail -n 1 | sed 's/.*\"full_name\": *\"\\([^\"]*\\)\".*/\\1/')\nif [ -n \"$parent\"\
        \ ] && [ \"$parent\" != \"Numbersf/Action-Build\" ]; then\n  echo \"::warning title=Source Warning::您使用的内核编译地址为非官方源，可能导致运行失败或内核异常。\"\
        \nfi\n"
    - name: Reject Check
      run: 'REJ_CHECKER="$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/check_rejects.sh"

        chmod +x "$REJ_CHECKER"

        echo "REJ_CHECKER=$REJ_CHECKER" >> $GITHUB_ENV

        '
    - name: Restore APT Cache
      id: apt-cache
      uses: actions/cache@v5
      with:
        path: ~/.apt-pkg-cache
        key: apt-cache-${{ runner.os }}-${{ github.ref_name }}-v6
    - name: Install Dependencies
      run: 'export APT_PACKAGES="python3 git curl libelf-dev build-essential flex bison libssl-dev libncurses-dev liblz4-tool zlib1g-dev
        libxml2-utils rsync unzip gawk dos2unix kmod libdw-dev elfutils dwarves"

        bash "$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/cache_apt_pkgs.sh" ~/.apt-pkg-cache

        '
    - name: Setup Kotlin
      run: 'KOTLIN_VERSION="2.4.10"

        curl -sL "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" -o
        kotlinc.zip

        unzip -q kotlinc.zip -d "$HOME"

        echo "$HOME/kotlinc/bin" >> "$GITHUB_PATH"

        '
    - name: Setup Ccache-ECS
      run: 'LIB_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/lib"

        sudo cp -f "$LIB_DIR/ccache" /usr/bin/ccache && sudo chmod +x /usr/bin/ccache

        '
    - name: Restore Ccache
      if: ${{ 'false' == 'false' }}
      id: restore-ccache
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.CCACHE_DIR }}
