        \ can be allocated to mqueue[?] \\*\\//\\t\\/\\/unsigned long mq_bytes;\\t\\/* How many bytes can be allocated to mqueue? *\\\
        //' include/linux/sched/user.h\n  sed -i '/struct ratelimit_state ratelimit;/,/ANDROID_OEM_DATA_ARRAY(1, 2);/{/^\\tANDROID_KABI_RESERVE(1);/{N;N;s/^\\\
        tANDROID_KABI_RESERVE(1);\\n\\tANDROID_KABI_RESERVE(2);\\n\\tANDROID_OEM_DATA_ARRAY(1, 2);/#if defined(CONFIG_POSIX_MQUEUE)\\\
        n\\tANDROID_KABI_USE(1, unsigned long mq_bytes);\\n\\tANDROID_KABI_RESERVE(2);\\n\\tANDROID_OEM_DATA_ARRAY(1, 2);\\n#else\\\
        n\\tANDROID_KABI_RESERVE(1);\\n\\tANDROID_KABI_RESERVE(2);\\n\\tANDROID_OEM_DATA_ARRAY(1, 2);\\n#endif/}}' include/linux/sched/user.h\n\
        # 检查 sched.h 并修改 KABI 槽位或指针\nelif grep -q \"sched_dl_entity.*\\*dl_server\" include/linux/sched.h; then\n  echo \"✅ 检测到 dl_server\
        \ 指针，使用 packed union 方案\"\n  sed -i 's|\\tstruct sched_entity\\t\\tse;|#ifdef CONFIG_SYSVIPC\\n\\tunion {\\n\\t\\tchar __kabi_ignored_0;\\\
        n\\t\\tstruct sysv_sem\\t\\t\\tsysvsem;\\n\\t}__attribute__((packed));\\n\\tunion {\\n\\t\\tchar __kabi_ignored_1;\\n\\t\\tstruct\
        \ sysv_shm\\t\\t\\tsysvshm;\\n\\t}__attribute__((packed));\\n#endif\\n\\n\\tstruct sched_entity\\t\\tse;|' include/linux/sched.h\n\
        elif grep -q \"ANDROID_KABI_USE(1,\" include/linux/sched.h; then\n  echo \"✅ 检测到 USE(1)，使用槽位 6,7,8\"\n  sed -i -e '/ANDROID_KABI_RESERVE(6);/{N;N;s|\\\
        tANDROID_KABI_RESERVE(6);\\n\\tANDROID_KABI_RESERVE(7);\\n\\tANDROID_KABI_RESERVE(8);|#ifdef CONFIG_SYSVIPC\\n\\tANDROID_KABI_USE(6,\
        \ struct sysv_sem sysvsem);\\n\\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(7); ANDROID_KABI_RESERVE(8), struct sysv_shm sysvshm);\\\
        n#else\\n\\tANDROID_KABI_RESERVE(6);\\n\\tANDROID_KABI_RESERVE(7);\\n\\tANDROID_KABI_RESERVE(8);\\n#endif|;}' include/linux/sched.h\n\
        elif grep -q \"ANDROID_KABI_RESERVE(1);\" include/linux/sched.h; then\n  echo \"✅ 检测到 RESERVE(1)，使用槽位 1,2,3\"\n  sed -i -e '/ANDROID_KABI_RESERVE(1);/{N;N;N;N;N;N;N;s|\\\
        tANDROID_KABI_RESERVE(1);\\n\\tANDROID_KABI_RESERVE(2);\\n\\tANDROID_KABI_RESERVE(3);\\n\\tANDROID_KABI_RESERVE(4);\\n\\tANDROID_KABI_RESERVE(5);\\\
        n\\tANDROID_KABI_RESERVE(6);\\n\\tANDROID_KABI_RESERVE(7);\\n\\tANDROID_KABI_RESERVE(8);|#ifdef CONFIG_SYSVIPC\\n\\tANDROID_KABI_USE(1,\
        \ struct sysv_sem sysvsem);\\n\\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(2); ANDROID_KABI_RESERVE(3), struct sysv_shm sysvshm);\\\
        n#else\\n\\tANDROID_KABI_RESERVE(1);\\n\\tANDROID_KABI_RESERVE(2);\\n\\tANDROID_KABI_RESERVE(3);\\n#endif\\n\\tANDROID_KABI_RESERVE(4);\\\
        n\\tANDROID_KABI_RESERVE(5);\\n\\tANDROID_KABI_RESERVE(6);\\n\\tANDROID_KABI_RESERVE(7);\\n\\tANDROID_KABI_RESERVE(8);|;}' include/linux/sched.h\n\
        elif grep -q \"ANDROID_KABI_RESERVE(3);\" include/linux/sched.h; then\n  echo \"✅ fallback，使用槽位 3,4,5\"\n  sed -i -e '/ANDROID_KABI_RESERVE(3);/{N;N;N;s|\\\
        tANDROID_KABI_RESERVE(3);\\n\\tANDROID_KABI_RESERVE(4);\\n\\tANDROID_KABI_RESERVE(5);\\n\\tANDROID_KABI_RESERVE(6);|#ifdef CONFIG_SYSVIPC\\\
        n\\tANDROID_KABI_USE(3, struct sysv_sem sysvsem);\\n\\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(4); ANDROID_KABI_RESERVE(5),\
