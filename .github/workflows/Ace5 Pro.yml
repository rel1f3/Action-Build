        echo \"Selected SCHED_HMBIRD: ${{ 'true' }}\"\necho \"Selected UNICODE_BYPASS: ${{ 'true' }}\"\necho \"Selected DROID_SPACES:\
        \ ${{ 'false' }}\"\necho \"Selected RE_KERNEL: ${{ 'false' }}\"\necho \"Selected LZ4_UPDATE: ${{ 'false' }}\"\necho \"Custom\
        \ BUILD_TIME: $BUILD_TIME\"\necho -n \"BUILD_TIME Unicode: \"\nCHECK_TEXT=\"$BUILD_TIME\" python3 \"$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/check_unicode_format.py\"\
        \ --mode build_time\necho \"Custom SUFFIX: $SUFFIX\"\necho -n \"SUFFIX Unicode: \"\nCHECK_TEXT=\"$SUFFIX\" python3 \"$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/check_unicode_format.py\"\
