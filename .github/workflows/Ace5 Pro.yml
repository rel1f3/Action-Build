    - name: Initialize Ccache
      if: ${{ 'false' == 'false' }}
      run: "INIT_FLAG=\"${{ env.CCACHE_DIR }}/.ccache_initialized\"\nif command -v ccache >/dev/null 2>&1; then\n  if [ ! -f \"$INIT_FLAG\"\
        \ ]; then\n    echo \"初始化 ccache (${{ env.CCACHE_DIR }})...\"\n    mkdir -p \"${{ env.CCACHE_DIR }}\"\n    ccache -M ${{ env.CCACHE_MAXSIZE\
        \ }}\n    touch \"$INIT_FLAG\"\n    echo \"✅ ccache 初始化完成\"\n  else\n    echo \"✅ ccache 已初始化，跳过\"\n  fi\nelse\n  echo \"❌ 未安装\
        \ ccache，跳过\"\nfi\nccache -s\n"
    - name: Install Repo Tool
      run: 'curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo

        chmod a+x ~/repo

        sudo mv ~/repo /usr/local/bin/repo

        '
    - name: Initialize Repo and Sync
      env:
        FILE: ${{ 'oneplus_ace5_pro_b' }}
      run: "cd kernel_workspace\nmkdir -p .repo/manifests\ncp \"$GITHUB_WORKSPACE/.repo/manifests_fallback/${FILE}.xml\" \".repo/manifests/${FILE}.xml\"\
        \nBASE_URL=\"https://github.com/${MANIFEST_REPO}/${MANIFEST_REPO_NAME}.git\"\n\necho \"使用$MANIFEST_REPO/$MANIFEST_REPO_NAME($MANIFEST_BRANCH)初始化仓库...\"\
        \nrepo init -u \"$BASE_URL\" -b \"$MANIFEST_BRANCH\" -m \"${FILE}.xml\" --depth=1 --no-clone-bundle --no-tags\nsed -i -e '/prebuilts\\\
        /asuite\"/{/ks-kernel\\.lnx\\.5\\.0\\.r3-rel/d}' -e '/tools\\/tradefederation\\/prebuilts\"/{/ks-kernel\\.lnx\\.5\\.0\\.r3-rel/d}'\
        \ \".repo/manifests/${FILE}.xml\"\ncp \"$GITHUB_WORKSPACE/custom/ace5pro/manifest.xml\" \".repo/manifests/${FILE}.xml\"\nrepo\
        \ sync -c -j$(nproc) --no-clone-bundle --no-tags --force-sync\nrepo manifest -r -o \"$GITHUB_WORKSPACE/resolved-manifest.xml\"\
        \npython3 \"$GITHUB_WORKSPACE/custom/ace5pro/overlay.py\" pins \"$PWD\"\n\n\nKERNEL_REPOS=\"\"\nKERNEL_REPOS_PATH=$(find . -type\
        \ f -name \"build.config.msm.common\" | head -n 1)\nif [[ -n \"$KERNEL_REPOS_PATH\" ]]; then\n  KERNEL_REPOS=$(echo \"${KERNEL_REPOS_PATH#./}\"\
        \ | cut -d/ -f2)\n  echo \"✅ 发现 build.config.msm.common: $KERNEL_REPOS_PATH\"\n  echo \"✅ KERNEL_REPOS=$KERNEL_REPOS\"\n  echo\
        \ \"KERNEL_REPOS=$KERNEL_REPOS\" >> \"$GITHUB_ENV\"\nelse\n  echo \"❎ 未找到 build.config.msm.common，可能是天玑清单或纯 Kleaf 构建结构\"\nfi\n\
        \n# 移除 ABI 保护\nfor dir in kernel_platform/common kernel_platform/$KERNEL_REPOS; do\n  if [ -e \"$dir/BUILD.bazel\" ]; then\n\
        \    sed -i '/^[[:space:]]*\"protected_exports_list\"[[:space:]]*:[[:space:]]*\"android\\/abi_gki_protected_exports_aarch64\"\
        ,$/d' \"$dir/BUILD.bazel\"\n  fi\n  rm -f \"$dir/android/abi_gki_protected_exports_\"* 2>/dev/null || echo \"No protected exports\
        \ in $dir\"\ndone\n\n# 移除构建审查\nif grep -q 'check_defconfig' kernel_platform/common/build.config.gki; then\n  sed -i 's/check_defconfig//'\
        \ kernel_platform/common/build.config.gki\nfi\nif grep -q 'check_defconfig = None,' kernel_platform/build/kernel/kleaf/common_kernels.bzl;\
        \ then\n  sed -i 's/check_defconfig = None,/check_defconfig = \"disabled\",/' kernel_platform/build/kernel/kleaf/common_kernels.bzl\n\
        \  sed -i 's/if check_defconfig == None:/if False:  # check_defconfig == None:/' kernel_platform/build/kernel/kleaf/common_kernels.bzl\n\
        fi\n"
    - name: Kernel Version Handling
      run: "cd kernel_workspace/kernel_platform\n# 获取内核 Android 版本号(KANDROID_VERSION)以及内核版本号(KERNEL_VERSION 2位)\nfor f in ./common/build.config.constants\
        \ ./common/build.config.common; do\n  if [ -f \"$f\" ]; then\n    KMI=$(grep -m1 '^BRANCH=' \"$f\" | cut -d= -f2)\n    [ -n\
        \ \"$KMI\" ] && break\n  fi\ndone\nif [[ -z \"$KMI\" && -n \"$KERNEL_REPOS\" ]]; then\n  KMI=$(grep -m1 '^android' \"./$KERNEL_REPOS/android/ACK_SHA\"\
        \ | cut -d- -f1,2)\nfi\nif [ -n \"$KMI\" ]; then\n  echo \"KMI=$KMI\" >> $GITHUB_ENV\n  echo \"KANDROID_VERSION=${KMI%-*}\"\
        \ >> $GITHUB_ENV\n  echo \"KERNEL_VERSION=${KMI#*-}\" >> $GITHUB_ENV\nelse\n  echo \"No KMI found in build.config* and ACK_SHA\
        \ files\"\nfi\n\n# 从 Makefile 获取完整内核版本号 (CD) 并拆分\nVERSIONLEVEL=$(awk '/^VERSION =/ {print $3}' ./common/Makefile)\nPATCHLEVEL=$(awk\
        \ '/^PATCHLEVEL =/ {print $3}' ./common/Makefile)\nSUBLEVEL=$(awk '/^SUBLEVEL =/ {print $3}' ./common/Makefile)\necho \"VERSIONLEVEL=$VERSIONLEVEL\"\
        \ >> $GITHUB_ENV\necho \"PATCHLEVEL=$PATCHLEVEL\" >> $GITHUB_ENV\n# SUBLEVEL 仅传递修改前的值，因为伪装并不影响原源码状态\necho \"SUBLEVEL=$SUBLEVEL\"\
        \ >> $GITHUB_ENV\nORIG_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v\".\"p\".\"\
        s}' ./common/Makefile)\n\n# 强制修改 SUBLEVEL (内核等级)\nRESUBLEVEL=\"${{ '' }}\"\nif [ -n \"$RESUBLEVEL\" ]; then\n  echo \"修改 SUBLEVEL\
        \ 为 $RESUBLEVEL\"\n  sed -i \"s/^SUBLEVEL[[:space:]]*=[[:space:]]*.*/SUBLEVEL = $RESUBLEVEL/\" ./common/Makefile\nelse\n  echo\
        \ \"未指定 SUBLEVEL，保持默认\"\nfi\n\n# 读取修改后的版本\nNEW_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3}\
        \ END {print v\".\"p\".\"s}' ./common/Makefile)\n# CKERNEL_VERSION(3位)：被修改之后或者未经过修改的完整内核版本号，用于欺骗系统\n# DKERNEL_VERSION(3位)：被修改之前的完整内核版本号，真实值\n\
        if [ \"$ORIG_VERSION\" != \"$NEW_VERSION\" ]; then\n  echo \"Kernel Version:$ORIG_VERSION->$NEW_VERSION\"\n  echo \"CKERNEL_VERSION=$NEW_VERSION\"\
        \ >> $GITHUB_ENV\n  echo \"DKERNEL_VERSION=$ORIG_VERSION\" >> $GITHUB_ENV\nelse\n  echo \"Kernel Version:$ORIG_VERSION No changes\"\
        \n  echo \"CKERNEL_VERSION=$ORIG_VERSION\" >> $GITHUB_ENV\nfi\n\n# 内核版本的数字转换，仅前两位不包含 SUBLEVEL\necho \"KERNEL_SHORT_PATCH_VERSION=$(echo\
        \ $NEW_VERSION | cut -d. -f1,2 | tr '.' '_')\" >> $GITHUB_ENV\n"
    - name: Rust Version Handling
      run: "cd kernel_workspace/kernel_platform\n# 从 build.config.constants 读取 RUSTC_VERSION\nRUSTC_VERSION=\"\"\nif [[ -f ./common/build.config.constants\
        \ ]]; then\n  RUSTC_VERSION=$(grep '^RUSTC_VERSION=' ./common/build.config.constants | cut -d'=' -f2 || true)\nfi\nif [[ -n\
        \ \"$RUSTC_VERSION\" ]]; then\n  echo \"✅ RUSTC_VERSION(原始)=$RUSTC_VERSION\"\n  RUSTC_DIR_VERSION=$(echo \"$RUSTC_VERSION\"\
        \ | grep -oE '^[0-9]+\\.[0-9]+\\.[0-9]+')\n  if [[ -z \"$RUSTC_DIR_VERSION\" ]]; then\n    RUSTC_DIR_VERSION=\"$RUSTC_VERSION\"\
        \n  fi\n  echo \"✅ RUSTC_DIR_VERSION(用于目录匹配)=$RUSTC_DIR_VERSION\"\n  echo \"RUSTC_VERSION=$RUSTC_VERSION\" >> $GITHUB_ENV\n\
        \  echo \"RUSTC_DIR_VERSION=$RUSTC_DIR_VERSION\" >> $GITHUB_ENV\n  echo \"ENABLE_RUST=true\" >> $GITHUB_ENV\nelse\n  echo \"\
        ✅ RUSTC_VERSION 未找到，Rust 编译已禁用\"\n  echo \"ENABLE_RUST=false\" >> $GITHUB_ENV\nfi\n"
    - name: Custom Kernel Suffix if set
      if: ${{ '-1' != '' && '-1' != '-1' }}
      run: "cd kernel_workspace/kernel_platform\nSUFFIX=\"${{ '-1' }}\"\nFAST_BUILD=\"${{ 'false' }}\"\n\nfor f in ./common/scripts/setlocalversion\
        \ ./\"$KERNEL_REPOS\"/scripts/setlocalversion ./external/dtc/scripts/setlocalversion; do\n  [ -f \"$f\" ] || continue\n  echo\
        \ \"Modifying: $f\"\n\n  # Remove -dirty\n  sed -i 's/ -dirty//g' \"$f\"\n  sed -i '$i res=$(echo \"$res\" | sed '\\''s/-dirty//g'\\\
        '')' \"$f\"\n\n  if grep -q 'KERNELVERSION.*scm_version' \"$f\"; then\n    echo \"Detected NEW setlocalversion format\"\n  \
        \  sed -i \"s|echo \\\"\\${KERNELVERSION}.*scm_version}\\\"|echo \\\"\\${KERNELVERSION}-${KANDROID_VERSION}-${SUFFIX}\\\"|\"\
        \ \"$f\"\n  elif grep -q 'echo \"\\$res\"' \"$f\"; then\n    echo \"Detected OLD setlocalversion format\"\n    if [ \"$FAST_BUILD\"\
        \ = \"true\" ]; then\n      echo \"FAST_BUILD enabled: using static res\"\n      sed -i \"s/^res=.*/res=\\\"-${KANDROID_VERSION}-${SUFFIX}\\\
        \"/\" \"$f\"\n    else\n      echo \"Standard build: injecting suffix via cut/echo\"\n      if [[ -f ./build_with_bazel.py ]];\
        \ then\n        echo \"使用官方脚本编译且当使用 build_with_bazel 时，可能受特殊符号数量限制，编译失败请修改\"\n        echo \"When using the official script\
        \ and building with build_with_bazel, the build may fail due to a limit on the number of special characters. Please modify the\
        \ configuration if that happens.\"\n      fi\n      tac \"$f\" | sed \"0,/echo \\\"\\\\\\$res\\\"/s//res=\\\\\\$(echo \\\\\\\
        $res | cut -d- -f1-2)-${SUFFIX}; echo \\\"\\\\\\$res\\\";/\" | tac > \"$f.tmp\" && mv \"$f.tmp\" \"$f\"\n    fi\n  else\n  \
        \  echo \"Unknown format, appending echo manually\"\n    echo \"echo \\\"\\$res-${SUFFIX}\\\"\" >> \"$f\"\n  fi\n  chmod +x\
        \ \"$f\"\ndone\n"
    - name: Custom Kernel Random Suffix if empty
      if: ${{ '-1' == '' }}
      run: "cd kernel_workspace/kernel_platform\nFAST_BUILD=\"${{ 'false' }}\"\n\n# 生成随机数字和随机hash\nRANDOM_DIGIT=$(od -An -N1 -tu1 <\
        \ /dev/urandom | tr -d '[:space:]' | awk '{print $1 % 11}')\nRANDOM_HASH=$(od -An -N7 -tx1 /dev/urandom | tr -d ' \\n')\nRANDOM_SUFFIX=\"\
        ${RANDOM_DIGIT}-o-g${RANDOM_HASH}\"\n\nfor f in ./common/scripts/setlocalversion ./\"$KERNEL_REPOS\"/scripts/setlocalversion\
        \ ./external/dtc/scripts/setlocalversion; do\n  [ -f \"$f\" ] || continue\n  echo \"Modifying: $f\"\n\n  # Remove -dirty\n \
        \ sed -i 's/ -dirty//g' \"$f\"\n  sed -i '$i res=$(echo \"$res\" | sed '\\''s/-dirty//g'\\'')' \"$f\"\n\n  if grep -q 'KERNELVERSION.*scm_version'\
        \ \"$f\"; then\n    echo \"Detected NEW setlocalversion format\"\n    sed -i \"s|echo \\\"\\${KERNELVERSION}.*scm_version}\\\
        \"|echo \\\"\\${KERNELVERSION}-${KANDROID_VERSION}-${RANDOM_SUFFIX}\\\"|\" \"$f\"\n  elif grep -q 'echo \"\\$res\"' \"$f\";\
        \ then\n    echo \"Detected OLD setlocalversion format\"\n    if [ \"$FAST_BUILD\" = \"true\" ]; then\n      echo \"FAST_BUILD\
        \ enabled: using static res with random suffix\"\n      sed -i \"s/^res=.*/res=\\\"-${KANDROID_VERSION}-${RANDOM_SUFFIX}\\\"\
        /\" \"$f\"\n    else\n      echo \"Standard build: injecting random suffix via cut/echo\"\n      tac \"$f\" | sed \"0,/echo\
        \ \\\"\\\\\\$res\\\"/s//res=\\\\\\$(echo \\\\\\$res | cut -d- -f1-2)-${RANDOM_SUFFIX}; echo \\\"\\\\\\$res\\\";/\" | tac > \"\
        $f.tmp\" && mv \"$f.tmp\" \"$f\"\n    fi\n  else\n    echo \"Unknown format, appending echo manually\"\n    echo \"echo \\\"\
        \\$res-${RANDOM_SUFFIX}\\\"\" >> \"$f\"\n  fi\n  chmod +x \"$f\"\ndone\n"
    - name: Add SukiSU Ultra
      run: 'set -euo pipefail

        cd kernel_workspace/kernel_platform

        git clone --branch builtin https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU

        git -C KernelSU checkout --detach b20dee702035af09cb2ecb5f35443bbc1747f3e6

        ln -s ../../KernelSU/kernel common/drivers/kernelsu

        printf ''\nobj-$(CONFIG_KSU) += kernelsu/\n'' >> common/drivers/Makefile

        sed -i ''/endmenu/i source "drivers/kernelsu/Kconfig"'' common/drivers/Kconfig

        python3 "$GITHUB_WORKSPACE/custom/ace5pro/overlay.py" auth KernelSU

        echo ''KSUVER=40900'' >> "$GITHUB_ENV"

        echo ''KSU_MANAGER_BRANCH=904c60d18f026340ce38ca2d5a1da529aadcba1a'' >> "$GITHUB_ENV"

        echo ''KSU_BUILTIN_BRANCH=builtin'' >> "$GITHUB_ENV"

        '
    - name: Apply Fake Patches
      if: ${{ 'eba2a88a5ba303e3d79d08e0717b956e9cf784a1' != '-1' }}
      run: 'kotlin "$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/PatchFakePatches.kts" apply "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"

        '
    - name: Apply Patches SukiSU Ultra
      env:
        FILE: ${{ 'oneplus_ace5_pro_b' }}
      run: "cd kernel_workspace\nif [ \"${{ 'eba2a88a5ba303e3d79d08e0717b956e9cf784a1' }}\" != \"-1\" ]; then\n  SUSFS_META=\"${{ 'eba2a88a5ba303e3d79d08e0717b956e9cf784a1'\
        \ }}\"\n  git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}${{\
