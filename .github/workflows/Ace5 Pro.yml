    - name: Check packaged final Image and KPM provenance
      run: 'python3 custom/ace5pro/verify.py --image AnyKernel3/Image --raw kernel_workspace/kernel_platform/out/Final-Image-Find/raw-Image
        --patcher kernel_workspace/SukiSU_patch/kpm/patch_linux --platform kernel_workspace/kernel_platform --out AnyKernel3/build-provenance.json

        cp resolved-manifest.xml custom/ace5pro/profile.json AnyKernel3/

