        \ == \"# \" key \" is not set\" || index($0, key \"=\") == 1 { print ENVIRON[\"VAL\"]; next }\n      { print }\n    ' \"$CONFIG_FILE\"\
        \ > \"${CONFIG_FILE}.tmp\" && mv \"${CONFIG_FILE}.tmp\" \"$CONFIG_FILE\" || rm -f \"${CONFIG_FILE}.tmp\"\n  else\n    printf\
        \ '%s\\n' \"$val\" >> \"$CONFIG_FILE\"\n  fi\n}\n\nset_hide_config() {\n  local val=\"$1\"\n  local key=\"${val%%=*}\"\n  set_config\
        \ \"$val\"\n  HIDE_CONFIGS+=(\"$key\")\n}\n\ninject_fake_config() {\n  [ \"${#HIDE_CONFIGS[@]}\" -eq 0 ] && return 0\n  local\
        \ marker=\"# --- fake_config injector ---\"\n  if ! grep -qF \"$marker\" \"$MAKEFILE\"; then\n    {\n      printf '\\n%s\\n'\
