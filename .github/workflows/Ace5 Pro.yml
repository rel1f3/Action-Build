    - name: Extract and Process ZRAM Module
      if: startsWith('0/lz4kd/8589934592', '1/')
      id: zram_find
      run: "set -e\nZRAM_ZIP=\"${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/ZRAM.zip\"\n\nif [ ! -f \"$ZRAM_ZIP\" ]; then\n  echo\
        \ \"❌ 未找到 ZRAM.zip: $ZRAM_ZIP\"\n  echo \"upload=false\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\n\nunzip \"$ZRAM_ZIP\" -d ZRAM-Module\n\
        \nCONFIG_PROP=\"ZRAM-Module/config.prop\"\nif [ -f \"$CONFIG_PROP\" ]; then\n  echo \"修改 config.prop\"\n  sed -i \"s/^ZRAM_ALGO=.*/ZRAM_ALGO=${ZRAM_ALGO}/\"\
        \ \"$CONFIG_PROP\"\n  sed -i \"s/^ZRAM_SIZE=.*/ZRAM_SIZE=${ZRAM_SIZE}/\" \"$CONFIG_PROP\"\n  echo \"ZRAM_ALGO=${ZRAM_ALGO}\"\
        \n  echo \"ZRAM_SIZE=${ZRAM_SIZE}\"\nelse\n  echo \"❌ 未找到 config.prop\"\n  echo \"upload=false\" >> \"$GITHUB_OUTPUT\"\n  exit\
        \ 0\nfi\n\ntarget=\"./ZRAM-Module/zram/zram.ko\"\necho \"查找 zram.ko 模块文件...\"\nsearch_paths=(\n  \"./kernel_workspace/kernel_platform/out\"\
        \n  \"./kernel_workspace/device/qcom\"\n)\nzram_path=\"\"\nfor path in \"${search_paths[@]}\"; do\n  if [ -d \"$path\" ]; then\n\
        \    zram_path=$(find \"$path\" -type f -name \"zram.ko\" | head -n 1)\n    [ -n \"$zram_path\" ] && break\n  fi\ndone\nif [\
        \ -z \"$zram_path\" ]; then\n  zram_path=$(find \"./kernel_workspace\" -type f -name \"zram.ko\" | head -n 1)\nfi\nif [ -n \"\
        $zram_path\" ] && [ -f \"$zram_path\" ]; then\n  echo \"✅ zram.ko file finally located at: $zram_path\"\n  install -D \"$zram_path\"\
        \ \"$target\"\nelse\n  echo \"❌ 未找到 zram.ko 文件，可能是未支持的内核版本或构建失败\"\n  echo \"upload=false\" >> \"$GITHUB_OUTPUT\"\n  exit 0\n\
        fi\n"
    - name: Upload ZRAM Module
      if: startsWith('0/lz4kd/8589934592', '1/') && steps.zram_find.outputs.upload != 'false'
      uses: actions/upload-artifact@v7
      with:
        name: ZRAM-Module_${{ env.KERNEL_VERSION }}_${{ steps.extract_info.outputs.value }}
        path: ZRAM-Module/*
    - name: Check Cache Size Before Save
      if: ${{ 'false' == 'false' }}
      id: cache_size_check
      run: "check_size() {\n  local CACHE_DIR=\"$1\"\n  local CACHE_NAME=\"$2\"\n  if [[ ! -d \"$CACHE_DIR\" ]]; then\n    echo \"${CACHE_NAME}_save=false\"\
        \ >> \"$GITHUB_OUTPUT\"\n    return\n  fi\n  SIZE_MB=$(du -sm \"$CACHE_DIR\" | cut -f1)\n  echo \"$CACHE_DIR 大小: ${SIZE_MB}MB\"\
        \n  if (( SIZE_MB >= 5 )); then\n    echo \"${CACHE_NAME}_save=true\" >> \"$GITHUB_OUTPUT\"\n  else\n    echo \"::warning title=Cache\
        \ Warning::$CACHE_NAME 小于 5MB，跳过保存\"\n    echo \"${CACHE_NAME}_save=false\" >> \"$GITHUB_OUTPUT\"\n  fi\n}\ncheck_size \"${{\
        \ env.CCACHE_DIR }}\" \"ccache\"\ncheck_size \"${{ github.workspace }}/kernel_workspace/.thinlto-cache\" \"thinlto\"\n"
    - name: Save Ccache
      if: ${{ 'false' == 'false' && steps.cache_size_check.outputs.ccache_save == 'true' && steps.restore-ccache.outputs.cache-hit !=
        'true' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ 'oneplus_ace5_pro_b' }}-${{ env.BUILD_METHOD }}-${{ 'false' == 'true'
          && 'alpha' || 'beta' }}-17.0
    - name: Save ThinLTO Cache
      if: ${{ 'false' == 'false' && 'false' == 'true' && steps.cache_size_check.outputs.thinlto_save == 'true' && steps.restore-thinlto.outputs.cache-hit
        != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ github.workspace }}/kernel_workspace/.thinlto-cache
        key: thinlto-${{ runner.os }}-${{ github.ref_name }}-${{ 'oneplus_ace5_pro_b' }}-17.0
    - name: Post-build Disk Check
      run: df -h
    timeout-minutes: 150
'on':
  workflow_dispatch: null
  push:
    branches:
    - SukiSU-Ultra
    paths:
    - custom/ace5pro/**
    - .github/workflows/Ace5 Pro.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: ace5pro-builtin-${{ github.ref }}
  cancel-in-progress: false
